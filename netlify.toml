# Netlify picks these up automatically: no settings to fill in by hand.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node 22.12 or newer.
  NODE_VERSION = "22"

# Security headers for every static file. On-demand responses (/admin, /api) get the same list
# from src/middleware.ts: keep the two equal. The Content-Security-Policy is generated by Astro
# per page (astro.config.mjs, security.csp) and sent as a header by the Netlify adapter.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Generated share images and icons change only when a deploy changes them.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
